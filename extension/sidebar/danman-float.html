<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DANMAN Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    #header { background: #1e293b; padding: 8px 12px; display: flex; align-items: center; gap: 8px;
              border-bottom: 1px solid #334155; cursor: move; user-select: none; }
    #header .title { font-weight: 600; font-size: 13px; flex: 1; color: #38bdf8; }
    #header button { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; padding: 2px 6px; }
    #header button:hover { color: #e2e8f0; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; max-width: 90%; word-wrap: break-word; }
    .msg.user { background: #1e3a5f; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg.assistant { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
    .msg.system { background: #334155; align-self: center; font-size: 11px; color: #94a3b8; text-align: center; }
    #input-area { padding: 8px 12px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 8px; }
    #chat-input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
                  color: #e2e8f0; padding: 8px 10px; font-size: 13px; resize: none; outline: none; }
    #chat-input:focus { border-color: #38bdf8; }
    #send-btn { background: #38bdf8; color: #0f172a; border: none; border-radius: 6px;
                padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
    #send-btn:hover { background: #7dd3fc; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #analyze-btn { background: #334155; color: #e2e8f0; border: none; border-radius: 6px;
                   padding: 8px 10px; font-size: 12px; cursor: pointer; }
    #analyze-btn:hover { background: #475569; }
    .typing { color: #94a3b8; font-style: italic; font-size: 12px; padding: 4px 12px; }
  </style>
</head>
<body>
  <div id="header">
    <span class="title">DANMAN Chat</span>
    <label style="font-size:11px;color:#94a3b8;display:flex;gap:4px;align-items:center;"><input type="checkbox" id="page-sight"> Page sight</label>
    <button id="mic-btn" title="Speech to text">&#127908;</button>
    <button id="analyze-btn" title="Analyze current page">Analyze Page</button>
    <button id="minimize-btn" title="Minimize">_</button>
    <button id="close-btn" title="Close">&#10005;</button>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="chat-input" rows="1" placeholder="Ask DANMAN anything..."></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="danman-float-init.js"></script>
</body>
</html>
